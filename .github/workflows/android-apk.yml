name: Build Android APK

# Builds an installable APK in GitHub's cloud (free) — no PC needed.
# Run it from your phone: repo → Actions tab → "Build Android APK" → Run workflow
# When it finishes, open the run and download the "vibeforge" artifact.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - '.github/workflows/android-apk.yml'

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses > /dev/null 2>&1 || true

      - name: Preinstall common Android SDK packages
        run: |
          sdkmanager --install "platform-tools" "platforms;android-36" "build-tools;36.0.0" > /dev/null 2>&1 || true
          sdkmanager --install "platforms;android-35" "build-tools;35.0.0" > /dev/null 2>&1 || true
          echo "Installed SDK packages:"; sdkmanager --list_installed 2>/dev/null | head -20 || true

      - name: Install JS dependencies
        working-directory: app
        run: npm install --no-audit --no-fund

      - name: Build debug APK
        working-directory: app/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Show build output location
        working-directory: app/android
        run: find . -name "*.apk" -type f 2>/dev/null || true

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: vibeforge
          path: app/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
