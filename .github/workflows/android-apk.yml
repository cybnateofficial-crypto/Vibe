name: Build Android APK

# Builds an installable APK in GitHub's cloud (free) — no PC needed.
# Run it from your phone: repo → Actions tab → "Build Android APK" → Run workflow
# When it finishes, open the run and download the "vibeforge" artifact.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - '.github/workflows/android-apk.yml'

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CI: '1'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install JS dependencies
        working-directory: app
        run: npm install --no-audit --no-fund

      - name: Generate native Android project (expo prebuild)
        working-directory: app
        run: npx expo prebuild --platform android --no-install

      # Uses the Android SDK that is already preinstalled on GitHub's Ubuntu runner.
      - name: Prepare Android SDK
        run: |
          set -e
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "Using SDK at: $SDK"
          SDKMGR="$(find "$SDK" -name sdkmanager -type f 2>/dev/null | head -1)"
          if [ -z "$SDKMGR" ]; then echo "sdkmanager not found in $SDK"; exit 1; fi
          yes | "$SDKMGR" --sdk_root="$SDK" --licenses > /dev/null 2>&1 || true
          "$SDKMGR" --sdk_root="$SDK" --install "platform-tools" "platforms;android-36" "build-tools;36.0.0" > /dev/null 2>&1 || true
          "$SDKMGR" --sdk_root="$SDK" --install "platforms;android-35" "build-tools;35.0.0" > /dev/null 2>&1 || true
          echo "sdk.dir=$SDK" > app/android/local.properties
          echo "--- local.properties ---"; cat app/android/local.properties

      - name: Build debug APK
        working-directory: app/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: List built APKs
        run: find app/android -name "*.apk" -type f 2>/dev/null || true

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: vibeforge
          path: app/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
