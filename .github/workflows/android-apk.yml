name: Build Android APK

# Builds an installable APK in GitHub's cloud (free) — no PC needed.
# Run it from your phone: repo → Actions tab → "Build Android APK" → Run workflow
# When it finishes, open the run and download the "vibeforge-apk" artifact.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - '.github/workflows/android-apk.yml'

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3

      - name: Install JS dependencies
        working-directory: app
        run: npm install --no-audit --no-fund

      - name: Build debug APK
        working-directory: app/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: vibeforge-apk
          path: app/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
